# Example camera file: cameras/<camera id>.toml (shared [agent]/[update] go in camagent.toml)
# Create with: camagent add    Edit with: camagent configure <camera>

# The camera on the local network
[camera]
host = ""
onvif_port = 80
username = ""
password = ""
rtsp_url = ""
ptz = true
ptz_profile = ""

# Video uplink to the server (ffmpeg -> SRT)
[stream]
enabled = true
audio = false
srt_latency_ms = 400
wallclock_timestamps = true
stall_seconds = 15
ffmpeg = ""

# Server connection details (the settings block from the camera's Connection page)
[platform]
camera_id = ""
ingest_host = ""
ingest_port = 8890
srt_password = ""
srt_passphrase = ""
mqtt_host = ""
mqtt_port = 1883
mqtt_tls = false
mqtt_password = ""

# Agent behavior
[agent]
max_move_ms = 2000
telemetry_interval_s = 30
stale_command_s = 5

# Where 'camagent update' installs from
[update]
repo = "https://github.com/msullivan1993/camagent.git"
ref = "main"
