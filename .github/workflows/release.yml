# Publishes a GitHub release whenever a version tag (v0.4.1, v0.5.0, ...) is pushed.
# Runs the tests first; the tag must match camagent/__init__.py's __version__.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write          # needed to create the release

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check the tag matches the version in the code
        run: |
          code_version=$(python -c "import re; print(re.search(r'__version__ = \"(.+?)\"', open('camagent/__init__.py').read()).group(1))")
          tag_version="${GITHUB_REF_NAME#v}"
          echo "tag: $tag_version   code: $code_version"
          if [ "$tag_version" != "$code_version" ]; then
            echo "::error::Tag v$tag_version doesn't match __version__ $code_version in camagent/__init__.py"
            exit 1
          fi

      - name: Install
        run: |
          python -m pip install --upgrade pip build
          python -m pip install .

      - name: Run tests
        run: |
          cd /tmp
          for t in "$GITHUB_WORKSPACE"/tests/test_*.py; do
            echo "== $t"
            python "$t"
          done

      - name: Build the package
        run: python -m build

      - name: Publish the release
        uses: softprops/action-gh-release@v2
        with:
          name: camagent ${{ github.ref_name }}
          generate_release_notes: true
          files: dist/*
