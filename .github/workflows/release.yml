# Makes a DRAFT GitHub release whenever a version tag (v0.16.0, ...) is pushed, after the tests pass; the tag must
# match camagent/__init__.py's __version__. Nothing is attached here: Mike's computer builds, signs and attaches the
# package and publishes the release (scripts/sign_release.py sign vX.Y.Z). Agents install only signed releases, so
# this workflow (or anyone with GitHub access) can't push an update to hosts.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write          # needed to create the release

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262   # v4 (pinned)

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065   # v5 (pinned)
        with:
          python-version: "3.12"

      - name: Check the tag matches the version in the code
        run: |
          code_version=$(python -c "import re; print(re.search(r'__version__ = \"(.+?)\"', open('camagent/__init__.py').read()).group(1))")
          tag_version="${GITHUB_REF_NAME#v}"
          echo "tag: $tag_version   code: $code_version"
          if [ "$tag_version" != "$code_version" ]; then
            echo "::error::Tag v$tag_version doesn't match __version__ $code_version in camagent/__init__.py"
            exit 1
          fi

      - name: Install
        run: |
          python -m pip install --upgrade pip build
          python -m pip install .

      - name: Run tests
        run: |
          cd /tmp
          for t in "$GITHUB_WORKSPACE"/tests/test_*.py; do
            echo "== $t"
            python "$t"
          done

      - name: Check the package builds
        run: python -m build

      - name: Publish the release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65   # v2 (pinned)
        with:
          name: camagent ${{ github.ref_name }}
          generate_release_notes: true
          draft: true
