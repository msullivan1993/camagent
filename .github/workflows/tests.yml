# Runs the tests on every push and pull request (release.yml runs them again before publishing a tag).
name: tests

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

concurrency:                      # a newer push cancels an older run still going
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # 3.12 like release.yml, and the newest. Not 3.11: test_v05 fakes Windows paths, which Python 3.11 refuses
        # on Linux (agents themselves are fine on 3.11).
        python: ["3.12", "3.14"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262   # v4 (pinned)
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065   # v5 (pinned)
        with:
          python-version: ${{ matrix.python }}
      - name: Install ffmpeg (test_v11 converts a real 4K clip to 1080p)
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Install
        run: python -m pip install .
      - name: Run tests
        run: |
          cd /tmp
          for t in "$GITHUB_WORKSPACE"/tests/test_*.py; do
            echo "== $t"
            python "$t"
          done
