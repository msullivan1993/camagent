# Runs the tests on every push and pull request (release.yml runs them again before publishing a tag).
name: tests

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:                      # a newer push cancels an older run still going
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.14"]  # oldest supported (pyproject), and the newest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: python -m pip install .
      - name: Run tests
        run: |
          cd /tmp
          for t in "$GITHUB_WORKSPACE"/tests/test_*.py; do
            echo "== $t"
            python "$t"
          done
