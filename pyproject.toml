[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "camagent"
dynamic = ["version"]
description = "YonderView camera site agent: SRT uplink and PTZ control over MQTT"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "onvif-zeep==0.2.12",
    "paho-mqtt>=2.1,<3",
]

[project.scripts]
camagent = "camagent.__main__:main"

[tool.setuptools]
packages = ["camagent"]

[tool.setuptools.package-data]
camagent = ["wsdl/*"]

[tool.setuptools.dynamic]
version = { attr = "camagent.__version__" }
